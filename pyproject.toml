[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentleash"
version = "0.2.1"
description = "Find AI agents on AWS (Bedrock AgentCore and Agents Classic) that hold more permissions than they need."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Theerthagiri E" }]
keywords = ["aws", "bedrock", "agentcore", "ai-agents", "iam", "security", "least-privilege"]
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agentleash = "agentleash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
